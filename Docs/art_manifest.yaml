# PKD 仮画像管理台帳 (art manifest)
#
# 目的: 画像が未設定・仮の箇所を一覧管理し、仮画像生成 → Unity割り当て → 後日の本番差し替え
# を追跡できるようにする。
#
# status の意味:
#   missing  - 画像が全く無い/未割り当て（このファイルの初期調査時点）
#   filled   - Tools/generate_placeholder_image.py が仮画像を生成し、Unityへ割り当て済み
#   blocked  - 仮画像は生成できるが、スクリプト側の変更なしにはUnityへ自動割り当てできない
#   done     - 本番画像に差し替え済み（このmanifestでは今のところ未使用）
#
# 注意: このmanifestに載っている画像はすべて仮素材である。本番画像に差し替える際は、
# target_path のファイルを差し替え、status を done に更新すること。
# 完成済み・確定済みの画像（例: AngerVertical.png, AnxietyVertical.png, Boss.png,
# 彼女の立ち絵, 各種背景ジャケット等）はこのmanifestには含めない（対象外）。
#
# 2026-09-03 更新: 以前ここにあった anger/anxiety_actor_defeated_flash・
# mother/friend_target_[abc]_defeated_flash の6件は撤去した。理由：
# EnemyAnger.defeatedSpriteは「撃破時のごく短いフラッシュ」用の任意フィールドで、
# 未設定なら見た目が変わらないだけで害はない。一方、識別ラベル入りの仮画像を
# 割り当てると、一瞬でも「AI_PLACEHOLDER」の文字が敵の上に表示され、未設定より
# 明らかに見た目が悪化するため、この用途には仮画像が不適切と判断した。
# 撃破・消去時の視覚フィードバックは、代わりにEmotionResolutionFlow.PlayElimination
# （既存スプライトの白フラッシュ+パーティクル+フェードで実現、新規画像は使わない）
# で対応した。今後もdefeatedSpriteに専用の白シルエット画像を用意する場合は、
# 新しいエントリをこのファイルへ追加すること。

- id: emotion_isolation_cage_battle
  status: blocked
  type: event_cg
  scene: SampleScene
  object: EmotionResolutionFlow.BuildCage（実行時にコードで棒状SpriteRendererを動的生成。シーン上に対応するGameObjectは存在しない）
  target_path: Assets/Art/AI_Placeholder/emotion_isolation_cage_battle.png
  width: 800
  height: 1200
  prompt: >
    怒り・不安・悲しみのいずれかの感情戦で「隔離する」を選んだ際、その場に落下してくる
    鉄格子の檻。縦長・背景透明のPNG。金属製の格子で敵キャラクター全体を閉じ込める見た目。
  notes: >
    要対応(コード変更が必要)。Assets/EmotionResolution/EmotionResolutionFlow.cs の
    doc-comment に「専用アートへ差し替えるまで、実行時生成した鉄格子で演出する」と明記。
    現状はBuildCage()/AddBar()が単色SpriteRendererの棒を動的生成しているため、
    仮画像は生成したがUnityシーンへの自動割り当て対象がない。
    スクリプトに [SerializeField] Sprite cageSprite のような差し替え用フィールドを追加し、
    BuildCage側の実装を変更する対応が必要（今回のタスクでは未実施。実装するか要確認）。

- id: emotion_isolation_cage_trueend
  status: blocked
  type: event_cg
  scene: SampleScene
  object: PrisonConsultationVisual.CreateCageBar（実行時にDontDestroyOnLoadで生成するUI Image。シーン上に対応するGameObjectは存在しない）
  target_path: Assets/Art/AI_Placeholder/emotion_isolation_cage_trueend.png
  width: 900
  height: 1080
  prompt: >
    TRUE END相談パートで、隔離済みの怒り・不安・悲しみと対話する際、既存の立ち絵
    （AngerVertical/AnxietyVertical/悲しみの立ち絵）の手前に重ねて表示する鉄格子フレーム。
    横幅の中央帯（画面中央、幅約760px相当）に格子が並ぶ構図、背景透明。
  notes: >
    要対応(コード変更が必要)。Assets/EmotionResolution/PrisonConsultationVisual.cs の
    CreateCageBarが単色Imageの棒(Top/Bottom/Bar1..7)を動的生成している。
    仮画像はあるが、スクリプトへのSprite差し替えフィールド追加が必要なため今回は未接続。

- id: trueend_consultation_background
  status: blocked
  type: background
  scene: SampleScene
  object: PrisonConsultationVisual.Shade（実行時生成のUI Image。シーン上に対応するGameObjectは存在しない）
  target_path: Assets/Art/AI_Placeholder/trueend_consultation_background.png
  width: 1920
  height: 1080
  prompt: 要確認
  notes: >
    要確認。現状は単色の暗い幕（rgba 0.015,0.02,0.035, a=0.96）のみで、専用背景CGが
    本当に必要かどうか現行仕様.mdに記載なし（TRUE END機能自体が現行仕様書に未反映）。
    内容を断定できないため、仮画像はプレースホルダーラベルのみで生成。
    採用するかどうかはユーザー確認のうえで判断すること。
